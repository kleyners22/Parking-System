<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard de Estacionamiento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand">🅿️ Estacionamiento</span>
  <span id="userInfo" class="text-white small"></span>
  <button id="btnLogout" class="btn btn-sm btn-outline-light d-none">Salir</button>
</nav>

<div class="container-fluid py-3">
  <!-- LOGIN -->
  <div id="loginView" class="row justify-content-center">
    <div class="col-md-4"><div class="card shadow-sm"><div class="card-body">
      <h5>Iniciar sesión</h5>
      <input id="username" class="form-control mb-2" placeholder="Usuario">
      <input id="password" type="password" class="form-control mb-2" placeholder="Contraseña">
      <button id="btnLogin" class="btn btn-primary w-100">Entrar</button>
      <div id="loginError" class="text-danger small mt-2"></div>
    </div></div></div>
  </div>

  <!-- MODULO OPERATIVO -->
  <div id="appView" class="d-none">
    <div id="alertBox"></div>
    <div class="row g-3">
      <div class="col-lg-4">
        <div class="card shadow-sm mb-3"><div class="card-body">
          <h5>Registrar entrada</h5>
          <input id="plate" class="form-control mb-2 text-uppercase" placeholder="Placa">
          <select id="location" class="form-select mb-2"></select>
          <select id="vehicleType" class="form-select mb-2"></select>
          <select id="entryAp" class="form-select mb-2"></select>
          <button id="btnEntry" class="btn btn-success w-100">Registrar entrada</button>
          <div id="qrBox" class="text-center mt-3"></div>
        </div></div>

        <div class="card shadow-sm"><div class="card-body">
          <h5>Registrar salida</h5>
          <input id="exitCode" class="form-control mb-2" placeholder="Código de transacción (o escanear QR)">
          <select id="exitAp" class="form-select mb-2"></select>
          <button id="btnExit" class="btn btn-warning w-100">Registrar salida y cobrar</button>
          <div id="exitResult" class="mt-3"></div>
        </div></div>
      </div>

      <div class="col-lg-8">
        <div class="card shadow-sm mb-3"><div class="card-body">
          <h5>Ocupación</h5>
          <canvas id="occupancyChart" height="90"></canvas>
        </div></div>
        <div class="card shadow-sm"><div class="card-body">
          <h5>Vehículos en curso</h5>
          <div class="table-responsive">
            <table class="table table-sm align-middle">
              <thead><tr><th>Código</th><th>Placa</th><th>Tipo</th><th>Entrada</th><th>Tarifa</th><th></th></tr></thead>
              <tbody id="activeBody"></tbody>
            </table>
          </div>
        </div></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
